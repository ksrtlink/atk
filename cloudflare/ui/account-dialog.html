<dialog id="account-dialog" aria-labelledby="auth-heading">
  <div class="dialog-top"><span class="eyebrow">YOUR PERSONAL WORKSPACE</span><button class="icon-button" id="auth-close" aria-label="Close account settings">×</button></div>
  <h2 id="auth-heading">Welcome to TinyTrail.</h2>
  <p>One email account for your links and saved QR designs.</p>
  <div id="auth-signedin" class="hidden"><p class="account-email" id="auth-current-email"></p><p id="auth-verified-note"></p><div class="auth-actions"><button class="text-button" id="auth-check">I’ve verified my email</button><button class="text-button" id="auth-resend">Resend verification</button></div><button class="button secondary" id="auth-signout">Sign out</button></div>
  <div id="auth-signedout"><div class="account-tabs"><button id="auth-login-tab" class="active" type="button">Sign in</button><button id="auth-register-tab" type="button">Create account</button></div>
    <form id="auth-form"><label for="auth-email">Email address</label><input id="auth-email" type="email" autocomplete="email" required maxlength="254"><p class="field-hint">Use your work email, or another email permitted by this workspace.</p><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><button class="button primary" id="auth-submit" type="submit">Sign in <span>↗</span></button></form><button class="text-button" id="auth-reset">Forgot password?</button>
  </div>
  <p class="form-error hidden" id="auth-error" role="alert"></p><p class="account-note hidden" id="auth-message" role="status"></p>
</dialog>
